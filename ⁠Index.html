<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告白時刻 ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            color: #ffffff;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .container {
            padding: 20px;
            z-index: 10;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.15);
        }
        p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        .heart-btn {
            font-size: 4.5rem;
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            animation: pulse 1.5s infinite ease-in-out;
            filter: drop-shadow(0 4px 15px rgba(255, 255, 255, 0.5));
            transition: transform 0.1s;
        }
        .heart-btn:active {
            transform: scale(0.85);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }
        .floating-heart {
            position: absolute;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 2s forwards ease-out;
            z-index: 100;
            white-space: nowrap;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.8);
            }
            100% {
                opacity: 0;
                transform: translateY(-130px) scale(1.4);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>浪漫告白時刻 ❤️</h1>
        <p>點擊愛心或畫面任意處發送愛意</p>
        <button class="heart-btn" id="btn">💖</button>
    </div>

    <script>
        const messages = ["我愛你", "I Love You", "愛してる", "Je t'aime", "💖", "💕", "❤️", "永遠在一起"];
        
        function createHeart(x, y) {
            const heart = document.createElement("div");
            heart.className = "floating-heart";
            const msg = messages[Math.floor(Math.random() * messages.length)];
            heart.innerText = msg;
            
            const size = Math.random() * 0.8 + 1.2;
            heart.style.left = (x - 30) + "px";
            heart.style.top = (y - 30) + "px";
            heart.style.fontSize = `${size}rem`;
            heart.style.color = "#ffffff";
            heart.style.textShadow = "0 2px 8px rgba(0,0,0,0.25)";
            
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 2000);
        }

        document.addEventListener("click", (e) => {
            createHeart(e.clientX, e.clientY);
        });

        document.addEventListener("touchstart", (e) => {
            for (let i = 0; i < e.touches.length; i++) {
                createHeart(e.touches[i].clientX, e.touches[i].clientY);
            }
        });
    </script>
</body>
</html>
